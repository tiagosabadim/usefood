name: Migrations

# Merge na main com migration ou Edge Function nova → aplica em homologação.
# Produção só pelo botão "Run workflow", com aprovação no environment "producao".
on:
  push:
    branches: [main]
    paths: ['supabase/migrations/**', 'supabase/functions/**']
  workflow_dispatch:
    inputs:
      ambiente:
        description: Onde aplicar
        type: choice
        options: [homologacao, producao]
        default: homologacao

jobs:
  aplicar:
    runs-on: ubuntu-latest
    environment: ${{ inputs.ambiente || 'homologacao' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - run: supabase link --project-ref "$SUPABASE_PROJECT_REF"
      - run: supabase db push
      - run: supabase functions deploy --project-ref "$SUPABASE_PROJECT_REF"
