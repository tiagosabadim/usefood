<div
  style="
    font-family: Arial, Helvetica, sans-serif;
    color: #0d0f22;
    max-width: 480px;
    margin: 0 auto;
    padding: 24px;
  "
>
  <p style="font-size: 16px; margin: 0 0 16px">Seu código de acesso:</p>
  <p
    style="font-size: 36px; font-weight: 700; letter-spacing: 8px; margin: 0 0 24px; color: #2f4bff"
  >
    {{ .Token }}
  </p>
  <p style="font-size: 14px; color: #545a75; margin: 0 0 8px">
    Digite esse código na tela de entrada. Ele vale por 1 hora.
  </p>
  <p style="font-size: 14px; color: #545a75; margin: 0">
    Se você não pediu para entrar, é só ignorar este e-mail.
  </p>
</div>
